name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Non-secret placeholders. Prisma generate/validate and the Next build
      # only require the variables to be DEFINED; CI never connects to a
      # database and never applies migrations. Real credentials must never be
      # committed or injected here.
      DATABASE_URL: "postgresql://mirror:mirror@localhost:5432/mirror_ci?schema=public"
      DIRECT_URL: "postgresql://mirror:mirror@localhost:5432/mirror_ci?schema=public"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Route structure check
        run: npm run check:routes

      # Required production build. The Phase 17B Vercel staging attempt failed
      # with App Router route collisions while CI stayed green, so the build is
      # a required step and must never fail silently. No Clerk secrets are
      # present; the placeholder DATABASE_URL/DIRECT_URL values above only need
      # to be defined for Prisma generate/validate and compilation.
      - name: Build
        run: npm run build
